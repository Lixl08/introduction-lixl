        html { scroll-behavior: smooth; }

            color: #e2e8f0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
        }

        /* ===== Background Glow Blobs ===== */
        .glow-blob {
            position: fixed;
            border-radius: 9999px;
            filter: blur(140px);
            pointer-events: none;
            z-index: 0;
        }
        .glow-cyan {
            top: -180px;
            left: -160px;
            width: 560px;
            height: 560px;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.18) 0%, rgba(34, 211, 238, 0) 70%);
        }
        .glow-indigo {
            bottom: -200px;
            right: -180px;
            width: 620px;
            height: 620px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.22) 0%, rgba(99, 102, 241, 0) 70%);
        }

        /* ===== Glass card base ===== */
        .glass {
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1rem;
        }
        .glass-strong {
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
        }

        /* ===== Gradient text ===== */
        .text-gradient {
            background: linear-gradient(135deg, #67e8f9 0%, #22d3ee 40%, #818cf8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .text-gradient-num {
            background: linear-gradient(135deg, #22d3ee 0%, #06b6d4 50%, #6366f1 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ===== Cyan pill badge ===== */
        .pill-cyan {
            background: rgba(34, 211, 238, 0.08);
            border: 1px solid rgba(34, 211, 238, 0.22);
            color: #67e8f9;
            border-radius: 9999px;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1);
        }
        .pill-cyan:hover {
            border-color: rgba(34, 211, 238, 0.5);
            background: rgba(34, 211, 238, 0.14);
            transform: translateY(-1px);
        }

        /* ===== Buttons with hover glow ===== */
        .btn-glow {
            position: relative;
            transition: all 220ms cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-glow::after {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.55), rgba(99, 102, 241, 0.55));
            filter: blur(12px);
            opacity: 0;
            z-index: -1;
            transition: opacity 220ms cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-glow:hover::after { opacity: 0.85; }
        .btn-glow:hover { transform: translateY(-2px); }

        /* ===== Highlight card hover ===== */
        .stat-card {
            transition: transform 280ms cubic-bezier(0.4, 0, 0.2, 1), box-shadow 280ms cubic-bezier(0.4, 0, 0.2, 1), border-color 280ms cubic-bezier(0.4, 0, 0.2, 1);
        }
        .stat-card:hover {
            transform: translateY(-6px);
            border-color: rgba(34, 211, 238, 0.35);
            box-shadow: 0 18px 40px -12px rgba(34, 211, 238, 0.28), 0 0 0 1px rgba(34, 211, 238, 0.1) inset;
        }
        .stat-card:hover .stat-num {
            text-shadow: 0 0 22px rgba(34, 211, 238, 0.55);
        }

        /* ===== Timeline ===== */
        .timeline-rail {
            position: absolute;
            left: 11px;
            top: 8px;
            bottom: 8px;
            width: 2px;
            background: linear-gradient(180deg, rgba(34, 211, 238, 0.45), rgba(99, 102, 241, 0.15) 80%, transparent);
        }
        .timeline-dot {
            position: absolute;
            left: 4px;
            top: 6px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #22d3ee, #6366f1);
            box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.12), 0 0 12px rgba(34, 211, 238, 0.5);
        }

        /* ===== Skill bar ===== */
        .skill-bar-fill {
            background: linear-gradient(90deg, #06b6d4 0%, #22d3ee 50%, #818cf8 100%);
            box-shadow: 0 0 8px rgba(34, 211, 238, 0.5);
            transition: width 800ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ===== Tab nav ===== */
        .tab-btn-2 {
            position: relative;
            padding: 12px 18px;
            font-size: 13.5px;
            font-weight: 600;
            color: #94a3b8;
            white-space: nowrap;
            transition: color 200ms;
        }
        .tab-btn-2:hover { color: #e2e8f0; }
        .tab-btn-2[aria-selected="true"] { color: #67e8f9; }
        .tab-btn-2[aria-selected="true"]::after {
            content: "";
            position: absolute;
            left: 18px; right: 18px; bottom: 0;
            height: 2px;
            background: linear-gradient(90deg, #22d3ee, #6366f1);
            border-radius: 9999px;
        }

        /* ===== Cert thumbnails ===== */
        .cert-thumb {
            aspect-ratio: 3/4;
            object-fit: cover;
            border-radius: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(15, 23, 42, 0.6);
            cursor: pointer;
            transition: all 200ms;
        }
        .cert-thumb:hover {
            transform: scale(1.04);
            border-color: rgba(34, 211, 238, 0.5);
            box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.2), 0 10px 24px -8px rgba(34, 211, 238, 0.3);
        }

        /* ===== Lightbox ===== */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(3, 7, 18, 0.92);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 220ms, visibility 220ms;
            padding: 24px;
        }
        .lightbox.active { opacity: 1; visibility: visible; }
        .lightbox img {
            max-width: 92vw;
            max-height: 88vh;
            object-fit: contain;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            left: 50%;
            bottom: 32px;
            transform: translate(-50%, 24px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 280ms, transform 280ms, visibility 280ms;
            z-index: 1500;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, 0);
        }

        /* ===== Back to top ===== */
        .back-top {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #67e8f9;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
            opacity: 0;
            visibility: hidden;
            transform: translateY(16px);
            transition: all 280ms;
            z-index: 900;
            cursor: pointer;
        }
        .back-top.visible { opacity: 1; visibility: visible; transform: translateY(0); }
        .back-top:hover {
            border-color: rgba(34, 211, 238, 0.5);
            box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.2), 0 12px 36px rgba(34, 211, 238, 0.3);
            transform: translateY(-3px);
        }

        /* ===== Fade in ===== */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-hidden { opacity: 0; transform: translateY(12px); transition: opacity 400ms, transform 400ms; }
        .fade-visible { opacity: 1; transform: translateY(0); }
        .fade-in-anim { animation: fadeUp 300ms ease-out forwards; }

        /* ===== Scrollbar ===== */
        ::-webkit-scrollbar { width: 8px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.35);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover { background: rgba(34, 211, 238, 0.55); }

        /* ===== Reduced motion ===== */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
            html { scroll-behavior: auto; }
        }

        /* ===== Print ===== */
        @media print {
            .glow-blob, .navbar, .back-top, .hero-actions, .toast { display: none !important; }

            .text-gradient, .text-gradient-num { -webkit-text-fill-color: #1a1d27 !important; }
            .pill-cyan { background: #f0f0f0 !important; color: #333 !important; border-color: #ccc !important; }
        }
    </style>

            function copyToClipboard(text) {
                return new Promise(function(resolve, reject) {
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(text).then(resolve).catch(function() {
                            fallbackCopy(text, resolve, reject);
                        });
                    } else {
                        fallbackCopy(text, resolve, reject);
                    }
                });
            }
            function fallbackCopy(text, resolve, reject) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                try {
                    const ok = document.execCommand('copy');
                    document.body.removeChild(ta);
                    if (ok) resolve(); else reject(new Error('copy failed'));
                } catch (e) {
                    document.body.removeChild(ta);
                    reject(e);
                }
            }

            /* ===== Tabs ===== */
            function initTabs(container) {
                const tabs = container.querySelectorAll('.tab-btn-2');
                const panels = container.querySelectorAll('.tab-panel-2');
                function activate(index) {
                    tabs.forEach(function(t, i) {
                        t.setAttribute('aria-selected', i === index ? 'true' : 'false');
                    });
                    panels.forEach(function(p, i) {
                        if (i === index) {
                            p.removeAttribute('hidden');
                            p.classList.add('fade-in-anim');
                            setTimeout(function() { p.classList.remove('fade-in-anim'); }, 320);
                        } else {
                            p.setAttribute('hidden', '');
                        }
                    });
                }
                tabs.forEach(function(tab, idx) {
                    tab.addEventListener('click', function() { activate(idx); });
                    tab.addEventListener('keydown', function(e) {
                        let n = -1;
                        if (e.key === 'ArrowRight') { e.preventDefault(); n = (idx + 1) % tabs.length; }
                        else if (e.key === 'ArrowLeft') { e.preventDefault(); n = (idx - 1 + tabs.length) % tabs.length; }
                        else if (e.key === 'Home') { e.preventDefault(); n = 0; }
                        else if (e.key === 'End') { e.preventDefault(); n = tabs.length - 1; }
                        if (n > -1 && n !== idx) { activate(n); tabs[n].focus(); }
                    });
                });
                activate(0);
            }

                    skillsGrid.appendChild(card);
                });
                refreshIcons();
                observeFadeIn(skillsGrid.querySelectorAll('.fade-hidden'));
            }

            /* ===== Render Education & Certificates ===== */
            function renderEducationCertificates() {
                eduCertGrid.innerHTML = '';

                if (resume.education && resume.education.school) {
                    const eduCard = document.createElement('div');
                    eduCard.className = 'glass p-5 fade-hidden stat-card';
                    let coursesHtml = '';
                    if (resume.education.courses && resume.education.courses.length) {
                        coursesHtml = '<div class="mt-4 pt-4 border-t border-white/5"><div class="text-[11px] font-semibold text-slate-500 mb-2.5 uppercase tracking-wider">主修课程</div><div class="flex flex-wrap gap-1.5">' +
                            resume.education.courses.map(function(c) {
                                return '<span class="pill-cyan" style="font-size:11.5px;padding:3px 10px;">' + escapeHtml(c) + '</span>';
                            }).join('') + '</div></div>';
                    }
                    eduCard.innerHTML =
                        '<div class="flex items-center gap-2.5 mb-3.5">' +
                            '<span class="inline-flex items-center justify-center w-8 h-8 rounded-lg" style="background: rgba(34, 211, 238, 0.1); border: 1px solid rgba(34, 211, 238, 0.22);">' +
                                lucideIcon('graduation-cap', 'w-4 h-4 text-cyan-300') +
                            '</span>' +
                            '<h4 class="text-[14.5px] font-bold text-white">教育背景</h4>' +
                        '</div>' +
                        '<div class="text-[15px] font-bold text-white">' + escapeHtml(resume.education.school) + '</div>' +
                        '<div class="text-[13px] text-cyan-300/90 mt-1">' + escapeHtml(resume.education.major) + ' · ' + escapeHtml(resume.education.degree) + '</div>' +
                        '<div class="inline-flex items-center gap-1.5 text-[12px] text-slate-400 mt-2 mb-1">' + lucideIcon('calendar', 'w-3 h-3') + escapeHtml(resume.education.period) + '</div>' +
                        (resume.education.gpa ? '<div class="text-[12px] text-slate-400">GPA: ' + escapeHtml(resume.education.gpa) + '</div>' : '') +
                        coursesHtml;
                    eduCertGrid.appendChild(eduCard);
                }

                if (resume.certificates && resume.certificates.length) {
                    const certCard = document.createElement('div');
                    certCard.className = 'glass p-5 fade-hidden stat-card';
                    let certHtml = '<div class="flex items-center gap-2.5 mb-3.5">' +
                        '<span class="inline-flex items-center justify-center w-8 h-8 rounded-lg" style="background: rgba(34, 211, 238, 0.1); border: 1px solid rgba(34, 211, 238, 0.22);">' +
                            lucideIcon('award', 'w-4 h-4 text-cyan-300') +
                        '</span>' +
                        '<h4 class="text-[14.5px] font-bold text-white">获奖与证书</h4></div>';
                    certHtml += '<div class="space-y-2">';
                    resume.certificates.forEach(function(cert) {
                        certHtml +=
                            '<div class="flex items-start gap-2.5 p-2.5 rounded-lg border border-white/5" style="background: rgba(15, 23, 42, 0.4);">' +
                                '<span class="inline-flex items-center justify-center w-7 h-7 rounded-md flex-shrink-0" style="background: rgba(34, 211, 238, 0.1); border: 1px solid rgba(34, 211, 238, 0.22);">' +
                                    lucideIcon('badge-check', 'w-4 h-4 text-cyan-300') +
                                '</span>' +
                                '<span class="text-[12.5px] text-slate-300 leading-relaxed pt-0.5">' + escapeHtml(cert) + '</span>' +
                            '</div>';
                    });
                    certHtml += '</div>';
                    certCard.innerHTML = certHtml;
                    eduCertGrid.appendChild(certCard);
                }

                refreshIcons();
                observeFadeIn(eduCertGrid.querySelectorAll('.fade-hidden'));
            }

            /* ===== Fade-in observer ===== */
            function observeFadeIn(elements) {
                if (!('IntersectionObserver' in window)) {
                    elements.forEach(function(el) {
                        el.classList.add('fade-visible');
                        el.classList.remove('fade-hidden');
                    });
                    return;
                }
                const observer = new IntersectionObserver(function(entries) {
                    entries.forEach(function(entry) {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('fade-visible');
                            entry.target.classList.remove('fade-hidden');
                            observer.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.08, rootMargin: '0px 0px -20px 0px' });
                elements.forEach(function(el) { observer.observe(el); });
            }

            /* ===== Nav visibility ===== */
            function updateNavVisibility() {
                if (navExpLink) navExpLink.style.display = hasExperienceData() ? '' : 'none';
                if (navProjLink) navProjLink.style.display = resume.projects.length === 0 ? 'none' : '';
            }

            /* ===== Init ===== */
            function init() {
                renderHero();
                renderHighlights();
                renderExperience();
                renderProjects();
                renderSkills();
                renderEducationCertificates();
                updateNavVisibility();
                toggleBackToTop();
                refreshIcons();
            }
            init();

            window.__resumeData = resume;
            window.__renderAll = function() {
                renderExperience();
                renderProjects();
                updateNavVisibility();
                refreshIcons();
            };
        })();
    </script>
</body>
</html>
